name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - bump-pixi

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prefix-dev/setup-pixi@v0.10.2
      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          pr-comment: false
          cache-key-prefix: kache-${{ github.job }}-${{ hashFiles('pixi.lock') }}
      - name: Run lint check
        run: pixi run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prefix-dev/setup-pixi@v0.10.2
      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          pr-comment: false
          cache-key-prefix: kache-${{ github.job }}-${{ hashFiles('pixi.lock') }}
      - name: Run tests
        run: pixi run backend-test

  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          # On Windows the default store (home dir) is on C: while the workspace is on D:, so kache can't hardlink into target/
          # https://github.com/kunobi-ninja/kache-action#cache-location
          cache-dir: ${{ runner.os == 'Windows' && format('{0}/kache', runner.temp) || '' }}
          pr-comment: false
          cache-key-prefix: kache-${{ github.job }}
      # The cc crate prefixes C compiles with RUSTC_WRAPPER when its file name
      # is "kache", but kache can't handle MSVC cl.exe and fails. Under any
      # other name cc leaves C compiles alone while kache still wraps rustc.
      - name: Rename kache wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wrapper = Join-Path $env:RUNNER_TEMP 'kache-wrapper.exe'
          Copy-Item $env:RUSTC_WRAPPER $wrapper
          "RUSTC_WRAPPER=$wrapper" >> $env:GITHUB_ENV
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: packaging
      - name: Build package
        run: pixi run --environment=packaging build-package
        env:
          RATTLER_BUILD_ENABLE_GITHUB_INTEGRATION: true
          RATTLER_BUILD_COLOR: always
      - name: Upload package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pixi run --environment=packaging upload-package

  build-intel-mac:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          pr-comment: false
          cache-key-prefix: kache-${{ github.job }}
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: packaging
      - name: Build package
        run: pixi run --environment=packaging build-package
        env:
          RATTLER_BUILD_ENABLE_GITHUB_INTEGRATION: true
          RATTLER_BUILD_COLOR: always
      - name: Upload package
        run: pixi run --environment=packaging upload-package
